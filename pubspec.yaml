name: bailongo
description: "BailonGO — aprendizaje y evaluación de pasos de baile (WSF Bronce) con visión por computadora."
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # UI / utils
  cupertino_icons: ^1.0.8

  # Video del modelo ideal (RF-07)
  video_player: ^2.9.1

  # Fase 3 — Pose / cámara (MediaPipe vía platform channel nativo)
  camera: ^0.11.0
  permission_handler: ^11.3.1

  # Foto de perfil (RF-02)
  image_picker: ^1.1.2

  # Sonido del conteo previo a la captura (RF-08)
  audioplayers: ^6.1.0

  # Visor 3D del paso (.glb con animaciones) sobre <model-viewer> en WebView.
  model_viewer_plus: ^1.10.0
  webview_flutter: ^4.14.1

  # Abre la política de privacidad (Configuración) en el navegador.
  url_launcher: ^6.3.0

  # Fases posteriores (se activan al llegar a su fase):
  # hive: ^2.2.3
  # hive_flutter: ^1.1.0
  # fl_chart: ^0.69.0
dependency_overrides:
  camera_android_camerax: ^0.7.4+7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # iOS usa CocoaPods: MediaPipeTasksVision solo se distribuye como pod.
  config:
    enable-swift-package-manager: false
  assets:
    - assets/videos/
    # assets/fixtures/ (tomas de prueba para calibrar) NO va en la app: los
    # scripts de tool/ las leen directo del disco.
    # Sonidos uno por uno para dejar fuera musica.mp3 (pista original de la que
    # sale musica_intento.m4a; la app no la usa).
    - assets/sounds/tick.wav
    - assets/sounds/go.wav
    - assets/sounds/musica_intento.m4a
    - assets/sounds/audio_guia_cucaracha.mp3
    - assets/sounds/basico_adelante_atras.m4a
    - assets/sounds/basico_guapeo.m4a
    - assets/sounds/cuban_break.m4a
    - assets/sounds/cucaracha.m4a
    - assets/sounds/cumbia_step.m4a
    - assets/sounds/giro_punta_talon.m4a
    - assets/sounds/kick_flick.m4a
    - assets/sounds/right_spot_turn.m4a
    - assets/sounds/suzy_q.m4a
    - assets/references/ # landmarks de las tomas ideales (tool/build_references.py)
    - assets/models/ # DanceGrid1.glb: maniquí 3D + pista con dance grid, una animación por paso
